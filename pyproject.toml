[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "device-simulator"
version = "0.1.0"
description = "A simulator framework for IoT and building devices"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pymodbus>=3.6.0,<3.7.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
]

[project.scripts]
device-simulator = "device_simulator.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0",
]

[tool.setuptools.packages.find]
where = ["src"]
